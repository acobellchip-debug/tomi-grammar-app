<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓国語文法演習アプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700&family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-light: #e3f2fd;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f8f9fa;
            --card-outline: #e0e0e0;
            --text-color: #333;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.7;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 500px;
            background-color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow);
        }

        /* Header */
        header {
            padding: 20px;
            background-color: var(--white);
            border-bottom: 1px solid var(--card-outline);
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 10px;
            margin-right: 10px;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* View Container */
        .view {
            padding: 20px;
            flex-grow: 1;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Top Page & Menus */
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        .menu-item {
            background: var(--white);
            border: 1px solid var(--card-outline);
            border-radius: 12px;
            margin-bottom: 15px;
            padding: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .menu-item:hover {
            border-color: var(--primary-color);
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .btn-outline {
            background-color: var(--white);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Explanation Page */
        .explanation-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .bubble {
            background-color: var(--bg-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            position: relative;
        }

        .korean-text {
            font-family: 'Gothic A1', sans-serif;
            font-size: 1.4rem;
            color: var(--primary-color);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(74, 144, 226, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .korean-text:hover {
            background: rgba(74, 144, 226, 0.2);
        }

        .korean-text::after {
            content: '🔊';
            font-size: 0.9rem;
        }

        .translation {
            font-size: 1.1rem;
            color: var(--secondary-color);
            margin-top: 5px;
        }

        .rule-card {
            background: var(--primary-light);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .vocab-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid var(--card-outline);
        }

        /* Quiz Page */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 18px;
            border: 2px solid var(--card-outline);
            border-radius: 12px;
            background: var(--white);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background: var(--primary-light);
        }

        .option-btn.correct {
            background-color: var(--success-color);
            color: var(--white);
            border-color: var(--success-color);
        }

        .option-btn.wrong {
            background-color: var(--error-color);
            color: var(--white);
            border-color: var(--error-color);
        }

        /* Score Page */
        .score-container {
            text-align: center;
            padding: 40px 0;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid var(--primary-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
        }

        .score-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        /* Utility */
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Header -->
        <header id="app-header">
            <button class="back-btn" id="global-back-btn" onclick="app.goBack()">←</button>
            <h1 id="header-title">韓国語演習</h1>
        </header>

        <!-- View: Top Menu -->
        <main id="view-top" class="view active">
            <h2>学習する回を選んでください</h2>
            <ul class="menu-list">
                <li class="menu-item" onclick="app.goToRound(2)">
                    <span>第2回：自己紹介しよう！</span>
                    <span>→</span>
                </li>
                <li class="menu-item" onclick="app.goToRound(3)">
                    <span>第3回：[こそあど言葉]と[이/가]・[아닙니다]</span>
                    <span>→</span>
                </li>
                <li class="menu-item" onclick="app.goToRound(4)">
                    <span>第4回：ですます文！[습니다]と[하고]</span>
                    <span>→</span>
                </li>
                <li class="menu-item" onclick="app.goToRound(5)">
                    <span>第5回：動詞・形容詞の否定文：[지 않습니다]と[안]</span>
                    <span>→</span>
                </li>
                <li class="menu-item" onclick="app.goToRound(6)">
                    <span>第6回：口語体の이에요/예요、分かち書きを学ぼう！</span>
                    <span>→</span>
                </li>
                <li class="menu-item" onclick="app.goToRound(7)">
                    <span>第7回：해요体の集中講義！活用・変則を完全網羅！</span>
                    <span>→</span>
                </li>
            </ul>
        </main>

        <!-- View: Round Menu -->
        <main id="view-round-menu" class="view">
            <h2 id="round-title">タイトル</h2>
            <div class="menu-list">
                <button class="btn btn-outline" onclick="app.goToExplanation()">💡 解説を読む</button>
                <button class="btn btn-primary" onclick="app.startQuiz()">📝 練習問題を解く</button>
            </div>
        </main>

        <!-- View: Explanation -->
        <main id="view-explanation" class="view">
            <div id="explanation-content">
                <!-- Data injected here -->
            </div>
        </main>

        <!-- View: Quiz -->
        <main id="view-quiz" class="view">
            <div class="quiz-header">
                <span id="quiz-progress">問題 1 / 10</span>
                <span id="quiz-score">正解数: 0</span>
            </div>
            <div class="question-text" id="question-text">質問文</div>
            <div class="options-list" id="options-list">
                <!-- Options injected here -->
            </div>
            <div id="quiz-feedback" style="margin-top: 20px; font-weight: 700; text-align: center; min-height: 1.5em;">
            </div>
            <button class="btn btn-primary hidden" id="next-question-btn" onclick="app.nextQuestion()">次の問題へ</button>
        </main>

        <!-- View: Score -->
        <main id="view-score" class="view">
            <div class="score-container">
                <h2>お疲れ様でした！</h2>
                <div class="score-circle">
                    <span class="score-value" id="final-score">0</span>
                    <span style="font-size: 0.9rem;">点 / 100</span>
                </div>
                <p id="score-message">素晴らしいですね！</p>
                <button class="btn btn-primary" onclick="app.goToView('top')">トップページへ戻る</button>
            </div>
        </main>
    </div>

    <script>
        const DATA = {

                },
                7: {
                    title: "해요体の集中講義！活用・変則を完全網羅！",
                    explanations: [

                            title: "解説1：해요体とは",
                            rule: "합니다体（語尾が「〜다」「〜습니다/ㅂ니다」）に対して、会話でよく使われる柔らかい敬語",

                                { ko: "학교에 갑니다 → 학교에 가요", ja: "합니다体 → 해요体" },

                        },
                        {

                                "前提②：語幹（語尾「다」の一つ前までの文字）",
                                "　例：놀다（遊ぶ）→ 語幹は「놀」",

                            examples: [

                                { ko: "세다 → 세요", ja: "強いです" },

                        },
                        {

                        },
                        {

                            groups: [

                                    rule: "ㄷ→ㄹ＋아요/어요",
                                    examples: [
                                        { ko: "깨닫다 → 깨달아요", ja: "悟ります（陽）" },
                                        { ko: "듣다 → 들어요", ja: "聞きます（陰）" },
                                        { ko: "믿다 → 믿어요", ja: "信じます ※例外（変則しない）" }
                                    ]
                                },
                                {
                                    name: "ㅂ変則",
                                    rule: "ㅂ→＋와요/워요",
                                    examples: [
                                        { ko: "돕다 → 도와요", ja: "助けます（陽）" },
                                        { ko: "가볍다 → 가벼워요", ja: "軽いです（陰）" },
                                        { ko: "입다 → 입어요", ja: "着ます ※例外" }
                                    ]
                                },
                                {
                                    name: "ㅅ変則",
                                    rule: "ㅅ→＋아요/어요（ㅅ脱落）",
                                    examples: [
                                        { ko: "낫다 → 나아요", ja: "治ります（陽）" },
                                        { ko: "짓다 → 지어요", ja: "建てます（陰）" },
                                        { ko: "웃다 → 웃어요", ja: "笑います ※例外" }
                                    ]
                                },
                                {
                                    name: "ㅎ変則",
                                    rule: "ㅎ→＋ㅐ요/ㅔ요",
                                    examples: [
                                        { ko: "빨갛다 → 빨개요", ja: "赤いです（陽）" },
                                        { ko: "누렇다 → 누레요", ja: "黄金色です（陰）" },
                                        { ko: "좋다 → 좋아요", ja: "良いです ※例外" }
                                    ]
                                },
                                {
                                    name: "으変則",
                                    rule: "ㅡ→＋ㅏ요/ㅓ요（語幹の最後の前の母音で判断）",
                                    examples: [
                                        { ko: "나쁘다 → 나빠요", ja: "悪いです（前が陽）" },
                                        { ko: "기쁘다 → 기뻐요", ja: "嬉しいです（前が陰）" },
                                        { ko: "쓰다 → 써요", ja: "書きます ※2文字の場合" }
                                    ]
                                },
                                {
                                    name: "르変則",
                                    rule: "르→ㄹ＋라요/러요",
                                    examples: [
                                        { ko: "모르다 → 몰라요", ja: "知りません（前が陽）" },
                                        { ko: "누르다 → 눌러요", ja: "押します（前が陰）" },
                                        { ko: "푸르다 → 푸르러요", ja: "青いです ※例外" }
                                    ]
                                }
                            ]
                        },
                        {
                            type: "vocabulary",
                            title: "語彙リスト",
                            items: [
                                { ko: "살다", ja: "住む" },
                                { ko: "좋다", ja: "良い" },
                                { ko: "가다", ja: "行く" },
                                { ko: "오다", ja: "来る" },
                                { ko: "보다", ja: "見る" },
                                { ko: "먹다", ja: "食べる" },
                                { ko: "만들다", ja: "作る" },
                                { ko: "쉬다", ja: "休む" },
                                { ko: "서다", ja: "立つ" },
                                { ko: "켜다", ja: "つける" },
                                { ko: "보내다", ja: "送る" },
                                { ko: "세다", ja: "強い" },
                                { ko: "배우다", ja: "習う" },
                                { ko: "되다", ja: "なる" },
                                { ko: "마시다", ja: "飲む" },
                                { ko: "사랑하다", ja: "愛する" },
                                { ko: "공부하다", ja: "勉強する" },
                                { ko: "깨닫다", ja: "悟る" },
                                { ko: "듣다", ja: "聞く" },
                                { ko: "믿다", ja: "信じる" },
                                { ko: "돕다", ja: "助ける" },
                                { ko: "가볍다", ja: "軽い" },
                                { ko: "입다", ja: "着る" },
                                { ko: "낫다", ja: "治る" },
                                { ko: "짓다", ja: "建てる・作る" },
                                { ko: "웃다", ja: "笑う" },
                                { ko: "빨갛다", ja: "赤い" },
                                { ko: "누렇다", ja: "黄金色だ" },
                                { ko: "나쁘다", ja: "悪い" },
                                { ko: "기쁘다", ja: "嬉しい" },
                                { ko: "쓰다", ja: "書く" },
                                { ko: "모르다", ja: "知らない" },
                                { ko: "누르다", ja: "押す" },
                                { ko: "푸르다", ja: "青い" }
                            ]
                        }
                    ],
                    quiz: [
                        { q: "살다の해요体は？", a: "살아요", options: ["살아요", "살어요", "사라요", "살요"] },
                        { q: "가다の해요体は？", a: "가요", options: ["가요", "가아요", "가어요", "갸요"] },
                        { q: "먹다の해요体は？", a: "먹어요", options: ["먹어요", "먹아요", "머거요", "먹요"] },
                        { q: "보다の해요体は？", a: "봐요", options: ["봐요", "보아요", "보요", "뵈요"] },
                        { q: "사랑하다の해요体は？", a: "사랑해요", options: ["사랑해요", "사랑하요", "사랑하어요", "사랑하아요"] },
                        { q: "듣다の해요体は？（ㄷ変則）", a: "들어요", options: ["들어요", "듣어요", "들아요", "듣아요"] },
                        { q: "돕다の해요体は？（ㅂ変則）", a: "도와요", options: ["도와요", "도워요", "돕아요", "돕어요"] },
                        { q: "짓다の해요体は？（ㅅ変則）", a: "지어요", options: ["지어요", "짓어요", "지아요", "짛어요"] },
                        { q: "빨갛다の해요体は？（ㅎ変則）", a: "빨개요", options: ["빨개요", "빨갛아요", "빨가요", "빨헤요"] },
                        { q: "모르다の해요体は？（르変則）", a: "몰라요", options: ["몰라요", "모르아요", "모러요", "몰러요"] }
                    ]
                }
            }
        };

        const app = {
            currentView: 'top',
            viewHistory: [],
            currentRound: null,
            currentQuestionIdx: 0,
            score: 0,
            isAnswering: false,

            init() {
                this.updateBackButton();
            },

            // 選択肢をシャッフルするユーティリティメソッド
            shuffle(array) {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            },

            speak(text) {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const uttr = new SpeechSynthesisUtterance(text);
                uttr.lang = 'ko-KR';
                window.speechSynthesis.speak(uttr);
            },

            goToView(viewId, pushHistory = true) {
                if (pushHistory) this.viewHistory.push(this.currentView);

                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById('view-' + viewId).classList.add('active');
                this.currentView = viewId;
                this.updateBackButton();

                // Dynamic titles
                const titles = {
                    'top': '韓国語演習',
                    'round-menu': this.currentRound ? DATA.rounds[this.currentRound].title : '各回のメニュー',
                    'explanation': '文法解説',
                    'quiz': '練習問題',
                    'score': '結果発表'
                };
                document.getElementById('header-title').textContent = titles[viewId] || '韓国語演習';
            },

            goBack() {
                if (this.viewHistory.length > 0) {
                    const prevView = this.viewHistory.pop();
                    this.goToView(prevView, false);
                }
            },

            updateBackButton() {
                const btn = document.getElementById('global-back-btn');
                if (this.currentView === 'top') {
                    btn.style.visibility = 'hidden';
                } else {
                    btn.style.visibility = 'visible';
                }
            },

            goToRound(roundId) {
                this.currentRound = roundId;
                document.getElementById('round-title').textContent = DATA.rounds[roundId].title;
                this.goToView('round-menu');
            },

            goToExplanation() {
                const roundData = DATA.rounds[this.currentRound];
                const container = document.getElementById('explanation-content');
                container.innerHTML = '';

                roundData.explanations.forEach(section => {
                    const sectionEl = document.createElement('div');
                    sectionEl.className = 'explanation-section';

                    let html = `<div class="section-title">${section.title}</div>`;

                    if (section.type === 'conversation') {
                        section.items.forEach(item => {
                            html += `
                                <div class="bubble">
                                    <div class="korean-text" onclick="app.speak('${item.ko}')">${item.ko}</div>
                                    <div class="translation">${item.ja}</div>
                                </div>
                            `;
                        });
                    } else if (section.type === 'grammar') {
                        html += `
                            <div class="rule-card">
                                <strong>ルール:</strong><br>${section.rule.replace(/\n/g, '<br>')}
                            </div>
                        `;
                        section.examples.forEach(ex => {
                            html += `
                                <div style="margin-bottom: 15px;">
                                    <div class="korean-text" onclick="app.speak('${ex.ko}')">${ex.ko}</div>
                                    <div class="translation">${ex.ja}</div>
                                </div>
                            `;
                        });
                    } else if (section.type === 'text_only') {
                        // 分かち書き解説用：音声再生なしのテキスト表示
                        if (section.description) {
                            html += `<div class="rule-card"><strong>${section.description}</strong></div>`;
                        }
                        if (section.rules) {
                            html += `<div class="rule-card">`;
                            section.rules.forEach(rule => {
                                html += `<div style="margin-bottom: 5px;">・${rule}</div>`;
                            });
                            html += `</div>`;
                        }
                        if (section.examples) {
                            section.examples.forEach(ex => {
                                html += `
                                    <div style="margin-bottom: 15px;">
                                        <div style="font-family: 'Gothic A1', sans-serif; font-size: 1.4rem; color: var(--primary-color); padding: 4px 8px;">${ex.ko}</div>
                                        <div class="translation">${ex.ja}</div>
                                    </div>
                                `;
                            });
                        }
                    } else if (section.type === 'irregular') {
                        // 変則活用セクション：複数の変則グループをカード形式で表示
                        if (section.description) {
                            html += `<div class="rule-card"><strong>${section.description}</strong></div>`;
                        }
                        section.groups.forEach(group => {
                            html += `<div style="background: var(--primary-light); border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--primary-color);">`;
                            html += `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; color: var(--primary-color);">【${group.name}】${group.rule}</div>`;
                            group.examples.forEach(ex => {
                                html += `
                                    <div style="margin-bottom: 10px; padding-left: 10px;">
                                        <div class="korean-text" onclick="app.speak('${ex.ko.split(' → ')[1] || ex.ko}')">${ex.ko}</div>
                                        <div class="translation">${ex.ja}</div>
                                    </div>
                                `;
                            });
                            html += `</div>`;
                        });
                    } else if (section.type === 'vocabulary') {
                        html += `<div class="vocab-grid">`;
                        section.items.forEach(vocab => {
                            html += `
                                <div class="vocab-item">
                                    <div class="korean-text" onclick="app.speak('${vocab.ko}')">${vocab.ko}</div>
                                    <span class="translation">${vocab.ja}</span>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }

                    sectionEl.innerHTML = html;
                    container.appendChild(sectionEl);
                });

                this.goToView('explanation');
            },

            startQuiz() {
                this.currentQuestionIdx = 0;
                this.score = 0;
                this.isAnswering = false;
                this.renderQuestion();
                this.goToView('quiz');
            },

            renderQuestion() {
                const roundData = DATA.rounds[this.currentRound];
                const qData = roundData.quiz[this.currentQuestionIdx];

                document.getElementById('quiz-progress').textContent = `問題 ${this.currentQuestionIdx + 1} / ${roundData.quiz.length}`;
                document.getElementById('quiz-score').textContent = `正解数: ${this.score}`;
                document.getElementById('question-text').textContent = qData.q;

                const optionsList = document.getElementById('options-list');
                optionsList.innerHTML = '';
                document.getElementById('quiz-feedback').textContent = '';
                document.getElementById('next-question-btn').classList.add('hidden');
                this.isAnswering = true;

                // 選択肢をコピーしてシャッフル
                const shuffledOptions = this.shuffle(qData.options);

                shuffledOptions.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => this.checkAnswer(opt, btn);
                    optionsList.appendChild(btn);
                });
            },

            checkAnswer(selected, btn) {
                if (!this.isAnswering) return;
                this.isAnswering = false;

                const roundData = DATA.rounds[this.currentRound];
                const qData = roundData.quiz[this.currentQuestionIdx];
                const feedbackEl = document.getElementById('quiz-feedback');

                const allBtns = document.querySelectorAll('.option-btn');

                if (selected === qData.a) {
                    btn.classList.add('correct');
                    feedbackEl.textContent = '正解！✨';
                    feedbackEl.style.color = 'var(--success-color)';
                    this.score++;
                    this.speak(selected);
                } else {
                    btn.classList.add('wrong');
                    feedbackEl.textContent = `残念... 正解は「${qData.a}」でした。`;
                    feedbackEl.style.color = 'var(--error-color)';

                    // Highlight correct answer
                    allBtns.forEach(b => {
                        if (b.textContent === qData.a) b.classList.add('correct');
                    });
                }

                document.getElementById('next-question-btn').classList.remove('hidden');
            },

            nextQuestion() {
                const roundData = DATA.rounds[this.currentRound];
                this.currentQuestionIdx++;

                if (this.currentQuestionIdx < roundData.quiz.length) {
                    this.renderQuestion();
                } else {
                    this.showScore();
                }
            },

            showScore() {
                const roundData = DATA.rounds[this.currentRound];
                const totalQuestions = roundData.quiz.length;
                const finalScore = Math.round((this.score / totalQuestions) * 100);

                document.getElementById('final-score').textContent = finalScore;

                let message = "";
                if (finalScore === 100) message = "パーフェクト！素晴らしいです！🎊";
                else if (finalScore >= 80) message = "その調子です！合格点ですね！👍";
                else if (finalScore >= 60) message = "あともう少し！復習してみましょう。";
                else message = "まずは解説をもう一度読んでみましょう。";

                document.getElementById('score-message').textContent = message;
                this.goToView('score');
            }
        };

        window.onload = () => app.init();
    </script>
